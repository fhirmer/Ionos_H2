<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Produktfinder | H2 Montage</title>
<link rel="canonical" href="https://finder.h2insektenschutz.de/">
<meta http-equiv="refresh" content="2; url=https://finder.h2insektenschutz.de/">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         font-size: 17px; line-height: 1.5; background: #f5f8f8; color: #1a2e2e; }
  .kasten { max-width: 460px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a { display: inline-block; margin-top: 16px; min-height: 52px; padding: 14px 24px;
      border-radius: 999px; background: #008080; color: #fff; font-weight: 600; text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1f22; color: #eef4f4; }
    a { background: #5cc2c2; color: #0f1f22; }
  }
</style>
</head>
<body>
<div class="kasten">
  <h1>Der Produktfinder ist umgezogen</h1>
  <p>Er läuft jetzt allein unter <strong>finder.h2insektenschutz.de</strong>. Diese Seite leitet dorthin weiter.</p>
  <a href="https://finder.h2insektenschutz.de/">Zum Produktfinder</a>
</div>
<script>
// Wer den Finder als App gespeichert hat, trägt hier noch einen Service Worker mit
// zwischengespeicherter alter Fassung. Der wird abgemeldet, sonst zeigt die alte
// Adresse offline weiter den Stand von früher. Danach erst die Weiterleitung.
(async function () {
    const ziel = 'https://finder.h2insektenschutz.de/';
    try {
        if (navigator.serviceWorker) {
            const registrierungen = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrierungen.map((r) => r.unregister()));
        }
        if (window.caches) {
            const namen = await caches.keys();
            await Promise.all(namen.filter((n) => n.startsWith('h2-produktfinder')).map((n) => caches.delete(n)));
        }
    } catch {
        // Aufräumen ist freiwillig; weitergeleitet wird in jedem Fall.
    }
    location.replace(ziel);
})();
</script>
</body>
</html>
